name: Release

# Reusable release workflow shared by the fastfields Python packages
# (dlpack / numpy / torch / cupy / fastfields).
#
# ---------------------------------------------------------------------------
# The shape of the pipeline
# ---------------------------------------------------------------------------
# Publishing is **release-driven**: a human drafts and publishes a GitHub
# Release in the package repo, choosing the tag there (e.g. `0.0.0.dev1`) and
# writing the notes. Everything downstream is automatic:
#
#   release: published  ->  build the wheel at that tag
#                       ->  upload the wheel back onto that same release
#                       ->  repository_dispatch fastfields/whl (index rebuild)
#
# So each package repo owns its own release: there is no central build, and no
# poller on the index side. Callers wire it up with:
#
#   name: Release
#   on:
#     release:
#       types: [published]
#     workflow_dispatch:
#       inputs:
#         tag: { description: "Existing release tag to (re)build", type: string }
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: fastfields/.github/.github/workflows/python-release.yml@main
#       with:
#         tag: ${{ github.event.release.tag_name || inputs.tag }}
#         compiled: false        # true only for fastfields-dlpack
#       secrets: inherit
#
# The `workflow_dispatch` leg exists so a failed publish can be retried against
# an already-published release without deleting and re-cutting it.
#
# ---------------------------------------------------------------------------
# Versioning
# ---------------------------------------------------------------------------
# All five packages use `versioningit`, which derives the version from
# `git describe`. Two things must hold, and this workflow enforces both:
#
#   * the checkout must NOT be shallow (`fetch-depth: 0`) or the tag is
#     invisible and the version silently degrades to "0+unknown";
#   * the build must happen at the release's tag, not at the branch head.
#
# The `publish` job additionally *asserts* that the version baked into the
# built wheels matches the release tag, so a silent "0+unknown" fails the run
# loudly instead of shipping a garbage version to the index.
#
# ---------------------------------------------------------------------------
# Secrets (passed via `secrets: inherit`)
# ---------------------------------------------------------------------------
#   CI_SUBMODULE_TOKEN  - read access to the C++ submodule chain. Only
#                         fastfields-dlpack needs it; elsewhere the checkout
#                         falls back to the default token.
#   WHL_DISPATCH_TOKEN  - fine-grained PAT with `contents: write` on
#                         fastfields/whl. The default GITHUB_TOKEN is scoped to
#                         the *calling* repo and cannot fire a workflow in
#                         another repo, so cross-repo dispatch needs this. If
#                         it is missing the dispatch is reported as a warning
#                         and the index simply has to be rebuilt by hand.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. 0.0.0.dev1)."
        type: string
        required: true
      compiled:
        description: >-
          True for the package that ships compiled artifacts
          (fastfields-dlpack). Pure-Python wrappers leave this false and get a
          single universal py3-none-any wheel plus an sdist.
        type: boolean
        default: false
      backend:
        description: >-
          Compute backend for a compiled build. Exported as FF_WHEEL_VARIANT
          and turned into the wheel's PEP 440 local version label (PyTorch
          convention) by the package's versioningit hook, e.g.
          0.0.0.dev1+cpu. Must match a wheel-index backend folder name
          exactly -- cpu, cu118, cu126, cu128 -- because that label is what
          generate.py buckets on. Ignored when compiled is false: the
          pure-Python wrappers have no variant axis, and an unlabelled wheel
          is deliberately listed in *every* backend folder. Also selects the
          `build-native` job's build (currently only "cpu" is wired -- see the
          note there).
        type: string
        default: cpu
      runners:
        description: >-
          JSON array of runner OSes for a compiled build. Defaults to Linux
          only: the C++ Makefiles are not yet Windows-portable
          (fastfields-dlpack#8), and the macOS leg needs cross-arch work before
          it can be trusted. Widening this ALSO requires a repair command for
          the new platform -- see the note on
          CIBW_REPAIR_WHEEL_COMMAND_LINUX below.
        type: string
        default: '["ubuntu-latest"]'
      cibw-python-selectors:
        description: >-
          JSON array of bare Python-interpreter tags, one per `build-compiled`
          matrix job -- each job builds only that interpreter's wheel
          (CIBW_BUILD: "<tag>-*"). No wildcard here: the value also names the
          job's upload-artifact, and GitHub Actions artifact names reject "*".
          Keeping these as separate jobs -- rather than one CIBW_BUILD string
          covering all of them -- is what lets each job `needs: build-native`
          and download the once-per-OS native library instead of rebuilding
          it.
        type: string
        default: '["cp39", "cp310", "cp311", "cp312"]'
      manylinux-image:
        description: >-
          manylinux image family for a compiled Linux build (passed to both
          CIBW_MANYLINUX_X86_64_IMAGE and the `build-native` job's container,
          so the once-per-OS native library is built in the exact same glibc
          environment cibuildwheel itself would use -- building it on the bare
          runner instead would bake in a newer glibc than the manylinux tag
          promises).
        type: string
        default: manylinux_2_28
      dispatch-index:
        description: "Ping fastfields/whl to regenerate the wheel index."
        type: boolean
        default: true

permissions:
  contents: write          # upload assets onto the release

jobs:
  # ------------------------------------------------------------ pure-Python
  # One universal wheel + an sdist. No compiler, no matrix, no local version
  # label: generate.py lists an unlabelled wheel in *every* backend folder.
  build-pure:
    if: ${{ !inputs.compiled }}
    name: build (universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0            # versioningit needs the tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build        # sdist + wheel into dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-universal
          path: dist/*

  # ------------------------------------------------------------ build-native
  # The compiled wheel's native libfastfields{,-cpu} does NOT depend on the
  # Python ABI -- only on OS + backend -- so it is built exactly once per
  # (OS, backend) here and handed to every `build-compiled` matrix job below
  # as an artifact, instead of each of them re-running the ~templated `make`
  # build from scratch (previously 4x per OS, once per cp3x wheel).
  #
  # Built inside the *same* manylinux container cibuildwheel itself uses
  # (`inputs.manylinux-image`), not on the bare runner: the runner's glibc is
  # newer than what the manylinux tag promises, and building there instead
  # would silently bake incompatible symbol versions into a "manylinux" wheel.
  # macOS (once `runners` is widened past Linux, fastfields-dlpack#8) has no
  # such container -- cibuildwheel builds directly on the host there too --
  # so that leg builds directly on the runner to match.
  #
  # STATUS: only the `cpu` backend is wired (mirrors release.yaml's current
  # scope). Extending to a CUDA backend needs an nvcc-capable runner/image and
  # `make USE_CUDA=1`, plus uploading libfastfields-cuda alongside the two
  # libs below -- not done here since no CUDA wheel is attempted yet.
  build-native:
    if: ${{ inputs.compiled }}
    name: build native (${{ inputs.backend }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive     # _fastfields_lib + its own submodules
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
          fetch-depth: 0            # versioningit needs the tag
      - name: Build libfastfields + libfastfields-cpu (manylinux container)
        if: runner.os == 'Linux'
        # `:latest` rather than pinning the exact tag cibuildwheel resolves
        # internally for CIBW_MANYLINUX_X86_64_IMAGE: what has to match is the
        # glibc ABI, which the manylinux_2_28 *policy* fixes regardless of
        # image tag/patch level -- that's the whole point of the manylinux
        # images -- so this doesn't need to track cibuildwheel's pin exactly.
        #
        # No `-j`: fastfields-lib's top-level Makefile links libfastfields.so
        # without depending on the libcpu sub-make finishing first (its `lib`
        # target lists `libcpu` before `$(BUILDDIR)/libfastfields.$(SOSUF)`,
        # but the latter's own prerequisites don't include the former, so make
        # -j is free to interleave them), so under parallel make the link
        # races ahead and fails to find -lfastfields-cpu -- confirmed by
        # hitting this exact race in a real run of this job. setup.py's
        # from-source path has always invoked plain `make` (no `-j`), which is
        # why the existing build never trips it; matching that here keeps this
        # job as reliable as the build it's replacing. `-j` would be a
        # legitimate follow-up (it needs a fix in fastfields-lib's Makefile
        # first), not something this PR should paper over.
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/project -w /project \
            "quay.io/pypa/${{ inputs.manylinux-image }}_x86_64:latest" \
            bash -c '
              set -euo pipefail
              (yum install -y clang gcc-c++ ||
               (apt-get update && apt-get install -y clang g++))
              git config --global --add safe.directory "*"
              make -C _fastfields_lib CXX=clang++
            '
      - name: Build libfastfields + libfastfields-cpu (host toolchain)
        if: runner.os != 'Linux'
        run: make -C _fastfields_lib CXX=clang++
      - name: Stage the built libs flat for upload
        run: |
          set -euo pipefail
          mkdir -p native-lib
          cp _fastfields_lib/build/libfastfields.* native-lib/
          cp _fastfields_lib/build/lib/libfastfields-cpu.* native-lib/
          ls -l native-lib
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.backend }}-${{ matrix.os }}
          path: native-lib/*
          if-no-files-found: error

  # --------------------------------------------------------------- compiled
  # cibuildwheel drives setup.py, which links the nanobind extension against
  # the native libs `build-native` already built (via FASTFIELDS_PREBUILT_LIB
  # -- setup.py copies them in and skips its own `make` step) and ships them
  # inside the wheel. One job per (os, python-selector) so each downloads the
  # native-lib artifact independently and the matrix is fully parallel.
  build-compiled:
    if: ${{ inputs.compiled }}
    name: build (${{ inputs.backend }}, ${{ matrix.os }}, ${{ matrix.python }})
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
        python: ${{ fromJSON(inputs.cibw-python-selectors) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive     # _fastfields_lib + its own submodules
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
          fetch-depth: 0            # versioningit needs the tag
      # Downloaded to a fixed path under the checkout root so it lands inside
      # cibuildwheel's /project mount; FASTFIELDS_PREBUILT_LIB below points
      # setup.py at it. build-native staged the two libs flat (no
      # build/ or build/lib/ nesting), matching what setup.py expects there.
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ inputs.backend }}-${{ matrix.os }}
          path: prebuilt-native-lib
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_SKIP: "*-musllinux_* *_i686 *-win32"
          # AlmaLinux 8 rather than cibuildwheel's default CentOS 7 image: its
          # system libstdc++ headers are GCC 8, which clang picks up without
          # any --gcc-toolchain steering. (CentOS 7's are GCC 4.8, whose
          # libstdc++ is patchy for C++11.) glibc 2.28+ is a fine floor for a
          # project that has never shipped a wheel.
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ inputs.manylinux-image }}
          # FF_WHEEL_VARIANT is read by fastfields-dlpack's custom versioningit
          # hook, which stamps the backend into the PEP 440 local version
          # identifier at build time (0.0.0.dev1+cpu). Doing it in versioningit
          # rather than by repacking the finished wheel means the version is
          # correct in METADATA, in RECORD and in the generated _version.py
          # from the outset, so nothing can drift out of sync.
          #
          CIBW_ENVIRONMENT: "CXX=clang++ FF_WHEEL_VARIANT=${{ inputs.backend }}"
          # FASTFIELDS_PREBUILT_LIB points setup.py at the native libs
          # `build-native` already built (download-artifact path above,
          # relative to the checkout root), so it copies them in and skips its
          # own `make` invocation entirely. Platform-specific because the path
          # cibuildwheel sees it at differs: /project is where the Linux
          # (manylinux container) build mounts the checkout. A future macOS
          # leg builds directly on the runner (no container), so it would need
          # CIBW_ENVIRONMENT_MACOS with the checkout's real host path instead
          # -- not wired here since macOS isn't in `runners` yet.
          CIBW_ENVIRONMENT_LINUX: >-
            CXX=clang++ FF_WHEEL_VARIANT=${{ inputs.backend }}
            FASTFIELDS_PREBUILT_LIB=/project/prebuilt-native-lib
          # `clang` for the C++ build -- and `gcc-c++` alongside it, which is
          # NOT redundant: clang is only the compiler driver, it uses the
          # system GCC's libstdc++ headers. Without gcc-c++ the manylinux image
          # has no C++ standard library headers at all and the build dies on
          # `fatal error: 'stdexcept' file not found` at the very first
          # translation unit. (The Makefiles are clang-only -- they hard-code
          # -ferror-limit / -ftemplate-backtrace-limit -- so building with g++
          # instead is not an option here.)
          #
          # `git config --global safe.directory` so versioningit can run
          # `git describe` against the bind-mounted, differently-owned /project
          # tree inside the container -- without it git refuses ("dubious
          # ownership") and the version degrades to "0+unknown".
          CIBW_BEFORE_ALL_LINUX: >-
            (yum install -y clang gcc-c++ ||
             (apt-get update && apt-get install -y clang g++)) &&
            git config --global --add safe.directory '*'
          # Vendor third-party deps and apply the manylinux tag, but leave our
          # own libfastfields* alone: the package already carries an
          # $ORIGIN/lib rpath and ships them itself.
          #
          # NOTE for whoever widens `runners` past Linux: the exclusion above
          # is the whole point of overriding this, and it does NOT carry over
          # to the other platforms. cibuildwheel would fall back to its stock
          # macOS (delocate) and Windows (delvewheel) repair, neither of which
          # knows that libfastfields{,-cpu,-cuda} are ours and already shipped
          # inside the wheel -- so they would be re-vendored, and on Windows
          # name-mangled, breaking the loader path fastfields/dlpack/__init__.py
          # sets up with os.add_dll_directory. Adding a macOS/Windows leg means
          # adding the matching CIBW_REPAIR_WHEEL_COMMAND_{MACOS,WINDOWS} with
          # the same excludes (`delocate-wheel --exclude libfastfields ...`,
          # `delvewheel repair --exclude ... `) and checking the flag spelling
          # against the tool versions cibuildwheel actually pins -- they are
          # deliberately not pre-wired here, because an untested repair command
          # for a leg that cannot run yet is worse than none.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair
            --exclude libfastfields.so
            --exclude libfastfields-cpu.so
            --exclude libfastfields-cuda.so
            -w {dest_dir} {wheel}
      - uses: actions/upload-artifact@v4
        with:
          # matrix.python included: this job now runs once per (os, python
          # selector) instead of once per os, so the name must stay unique
          # per job or upload-artifact rejects the collision.
          name: dist-${{ inputs.backend }}-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  # -------------------------------------------------------------- publish
  publish:
    name: publish to the release
    needs: [build-native, build-pure, build-compiled]
    # Exactly one of {build-pure, build-compiled} runs (build-native only
    # alongside build-compiled); `needs` on a skipped job resolves to
    # 'skipped', so gate on "nothing actually failed" rather than success().
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `pattern: dist-*` matters here: without it this would also sweep up
      # the `native-*` artifact (the raw .so files from build-native), which
      # would then get uploaded onto the release below by `gh release upload
      # dist/*` alongside the actual wheels/sdist.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Guard rail. The built version must equal the release tag *exactly*,
      # including the local label -- not merely start with it. Two distinct
      # failure modes are silent without this:
      #
      #   * a shallow checkout or unreachable tag degrades versioningit to
      #     "0+unknown", which still produces a perfectly valid-looking wheel;
      #   * a build that is tagged but not clean yields e.g.
      #     "0.0.0.dev1+cpu.4.gdeadbee". generate.py buckets on the *whole*
      #     local segment (`backend = local or "cpu"`), so that wheel would be
      #     filed under a phantom "cpu.4.gdeadbee" backend and never appear in
      #     cpu/ -- an index that looks fine and resolves to nothing.
      #
      # Comparing the full version catches both.
      - name: Assert the built version matches the release tag
        env:
          TAG: ${{ inputs.tag }}
          COMPILED: ${{ inputs.compiled }}
          BACKEND: ${{ inputs.backend }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no wheels were produced"; exit 1
          fi
          expected="${TAG#v}"
          if [ "$COMPILED" = "true" ]; then
            expected="${expected}+${BACKEND}"
          fi
          rc=0
          for w in "${wheels[@]}"; do
            # PEP 427 escapes '-' inside the version, so field 2 is the version.
            ver="$(basename "$w" | cut -d- -f2)"
            if [ "$ver" != "$expected" ]; then
              echo "::error::$(basename "$w"): version '$ver' != expected" \
                   "'$expected'. '0+unknown' means the checkout was shallow or" \
                   "the tag unreachable; a trailing '.N.g<sha>' means the tree" \
                   "was not clean at the tag, and the wheel index would file it" \
                   "under a phantom backend."
              rc=1
            fi
          done
          [ $rc -eq 0 ] && echo "all wheels report version $expected"
          exit $rc

      # generate.py reads a sibling <wheel>.sha256 release asset to emit the
      # PEP 503 '#sha256=' fragment (the Releases API exposes no per-asset
      # digest). Without these the index still works but warns and links
      # unpinned artifacts.
      - name: Generate sha256 sidecars
        run: |
          set -euo pipefail
          cd dist
          for f in *.whl *.tar.gz; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          ls -l

      - name: Upload artifacts onto the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        # --clobber makes a retry (workflow_dispatch) idempotent.
        run: gh release upload "$TAG" dist/* --clobber

      # Push-trigger the index rebuild from here, rather than having the index
      # poll for new assets.
      - name: Ping the wheel index to rebuild
        if: ${{ inputs.dispatch-index }}
        env:
          GH_TOKEN: ${{ secrets.WHL_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WHL_DISPATCH_TOKEN is not set, so fastfields/whl" \
                 "cannot be triggered from here (the default GITHUB_TOKEN is" \
                 "scoped to this repo). Run the 'Build and deploy wheel index'" \
                 "workflow in fastfields/whl by hand to pick these wheels up."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fastfields/whl/dispatches \
            -d '{"event_type":"wheels-updated"}'
          echo "dispatched wheels-updated to fastfields/whl"
