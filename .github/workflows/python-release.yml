name: Release

# Reusable release workflow shared by the fastfields Python packages
# (dlpack / numpy / torch / cupy / fastfields).
#
# ---------------------------------------------------------------------------
# The shape of the pipeline
# ---------------------------------------------------------------------------
# Publishing is **release-driven**: a human drafts and publishes a GitHub
# Release in the package repo, choosing the tag there (e.g. `0.0.0.dev1`) and
# writing the notes. Everything downstream is automatic:
#
#   release: published  ->  build the wheel at that tag
#                       ->  upload the wheel back onto that same release
#                       ->  repository_dispatch fastfields/whl (index rebuild)
#
# So each package repo owns its own release: there is no central build, and no
# poller on the index side. Callers wire it up with:
#
#   name: Release
#   on:
#     release:
#       types: [published]
#     workflow_dispatch:
#       inputs:
#         tag: { description: "Existing release tag to (re)build", type: string }
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: fastfields/.github/.github/workflows/python-release.yml@main
#       with:
#         tag: ${{ github.event.release.tag_name || inputs.tag }}
#         compiled: false        # true only for fastfields-dlpack
#       secrets: inherit
#
# The `workflow_dispatch` leg exists so a failed publish can be retried against
# an already-published release without deleting and re-cutting it.
#
# ---------------------------------------------------------------------------
# Dry runs: `publish: false`
# ---------------------------------------------------------------------------
# With `publish: false` every build job runs exactly as it would for a release
# -- same native-library build, same cibuildwheel invocation, same repair
# command -- and the wheels are left as workflow artifacts (`dist-*`). The
# `publish` job, and with it the version assertion, the release upload and the
# index ping, does not run, so `tag` may then be any ref (a PR head SHA). That
# is how a package repo proves on a pull request that its wheels still build
# on every platform, without a tag or a release. The caller must still grant
# `contents: write`: GitHub checks a called workflow's job permissions
# statically, skipped job or not, and `publish` declares it.
#
# ---------------------------------------------------------------------------
# Versioning
# ---------------------------------------------------------------------------
# All five packages use `versioningit`, which derives the version from
# `git describe`. Two things must hold, and this workflow enforces both:
#
#   * the checkout must NOT be shallow (`fetch-depth: 0`) or the tag is
#     invisible and the version silently degrades to "0+unknown";
#   * the build must happen at the release's tag, not at the branch head.
#
# The `publish` job additionally *asserts* that the version baked into the
# built wheels matches the release tag, so a silent "0+unknown" fails the run
# loudly instead of shipping a garbage version to the index.
#
# ---------------------------------------------------------------------------
# Secrets (passed via `secrets: inherit`)
# ---------------------------------------------------------------------------
# There is deliberately no submodule token, and no `submodules:` input. The
# checkouts below used to pass CI_SUBMODULE_TOKEN "for private submodules".
# Both halves of that are now false: every repo in the C++ chain is public, and
# since fastfields-dlpack#34 there is no submodule at all -- `_fastfields_lib`
# is a SHA in `fastfields-lib.sha` that setup.py clones at build time.
#
# The token was not merely redundant, it was fatal. The secret had expired, and
# an expired secret is *set* rather than empty, so a `|| github.token` fallback
# never fires: the checkout died with "could not read Username for
# 'https://github.com'" before any build step. THIS WORKFLOW IS WHERE THAT
# MATTERED MOST AND WAS NOTICED LEAST. A caller must keep `secrets: inherit`
# here (the publish and wheel-index steps need GITHUB_TOKEN and
# WHL_DISPATCH_TOKEN), so dropping the inherit at the caller -- which is what
# unblocked `Test` for fastfields-dlpack -- could not help the release path.
# The release path is also the least exercised one, so this would have
# surfaced for the first time during an actual release.
#
# `fetch-depth: 0` stays on every checkout: versioningit needs the tags.
#
#   WHL_DISPATCH_TOKEN  - fine-grained PAT with `contents: write` on
#                         fastfields/whl. The default GITHUB_TOKEN is scoped to
#                         the *calling* repo and cannot fire a workflow in
#                         another repo, so cross-repo dispatch needs this. If
#                         it is missing the dispatch is reported as a warning
#                         and the index simply has to be rebuilt by hand.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. 0.0.0.dev1)."
        type: string
        required: true
      compiled:
        description: >-
          True for the package that ships compiled artifacts
          (fastfields-dlpack). Pure-Python wrappers leave this false and get a
          single universal py3-none-any wheel plus an sdist.
        type: boolean
        default: false
      backend:
        description: >-
          Compute backend for a compiled build. Exported as FF_WHEEL_VARIANT
          and turned into the wheel's PEP 440 local version label (PyTorch
          convention) by the package's versioningit hook, e.g.
          0.0.0.dev1+cpu. Must match a wheel-index backend folder name
          exactly -- cpu, cu118, cu126, cu128 -- because that label is what
          generate.py buckets on. Ignored when compiled is false: the
          pure-Python wrappers have no variant axis, and an unlabelled wheel
          is deliberately listed in *every* backend folder. Also selects the
          `build-native` job's build (currently only "cpu" is wired -- see the
          note there).
        type: string
        default: cpu
      runners:
        description: >-
          JSON array of runner labels for a compiled build, one wheel each.
          Linux (x86_64, in the manylinux container), macOS and Windows (x64)
          are all wired. On macOS the wheel's architecture is the RUNNER's:
          nothing here cross-compiles, so an arm64 wheel needs an arm64 runner
          (macos-15, macos-latest) and an x86_64 one an Intel runner
          (macos-15-intel). Both build-native and build-compiled derive the
          arch from the runner with `uname -m`, pass it to the C++ build as
          ARCHFLAGS and to cibuildwheel as CIBW_ARCHS_MACOS, and fail if
          either the native libraries or the repaired wheel are for any other
          architecture -- so a mislabelled wheel cannot be produced.
          Defaults to Linux only, so that widening it is the caller's
          decision.
        type: string
        default: '["ubuntu-latest"]'
      macos-deployment-target:
        description: >-
          MACOSX_DEPLOYMENT_TARGET for macOS wheels: the minimum macOS the
          wheel's binaries load on, and the version in its platform tag
          (macosx_11_0_arm64). Exported to BOTH the native-library build and
          cibuildwheel -- they have to agree, or delocate rejects a library
          built for a newer macOS than the tag claims. 11.0 is the first
          release with arm64, and a floor the C++17 extension (std::optional
          et al.) is comfortably above on x86_64 too.
        type: string
        default: "11.0"
      publish:
        description: >-
          False for a dry run: build every wheel and upload them as workflow
          artifacts only -- no version assertion, no release upload, no index
          ping, and `tag` may be any ref. See "Dry runs" at the top.
        type: boolean
        default: true
      cibw-build-python:
        description: >-
          The single CPython cibuildwheel builds on, as a bare interpreter tag
          (CIBW_BUILD: "<tag>-*"). One value, not a list: fastfields-dlpack's
          extension is built in nanobind's split mode, which compiles against
          Python's limited API and emits one `<tag>-abi3-<plat>` wheel that
          every CPython from that tag up can install. So the Python axis is
          gone from `build-compiled` -- the matrix is one job per (OS,
          backend) -- and this names the floor, which must equal the
          Py_LIMITED_API version setup.py compiles against (cp310: nanobind's
          limited-API floor, see its split-mode note). Building on a *newer*
          CPython would still produce a wheel tagged for that newer one, so
          this is the floor and not merely "some 3.x".
        type: string
        default: cp310
      manylinux-image:
        description: >-
          manylinux image family for a compiled Linux build (passed to both
          CIBW_MANYLINUX_X86_64_IMAGE and the `build-native` job's container,
          so the once-per-OS native library is built in the exact same glibc
          environment cibuildwheel itself would use -- building it on the bare
          runner instead would bake in a newer glibc than the manylinux tag
          promises).
        type: string
        default: manylinux_2_28
      dispatch-index:
        description: "Ping fastfields/whl to regenerate the wheel index."
        type: boolean
        default: true

permissions:
  contents: write          # upload assets onto the release

jobs:
  # ------------------------------------------------------------ pure-Python
  # One universal wheel + an sdist. No compiler, no matrix, no local version
  # label: generate.py lists an unlabelled wheel in *every* backend folder.
  build-pure:
    if: ${{ !inputs.compiled }}
    name: build (universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0            # versioningit needs the tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build        # sdist + wheel into dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-universal
          path: dist/*

  # ------------------------------------------------------------ build-native
  # The compiled wheel's native libfastfields{,-cpu} does NOT depend on the
  # Python ABI -- only on OS + backend -- so it is built exactly once per
  # (OS, backend) here and handed to every `build-compiled` matrix job below
  # as an artifact, instead of each of them re-running the ~templated `make`
  # build from scratch (previously 4x per OS, once per cp3x wheel).
  #
  # Built inside the *same* manylinux container cibuildwheel itself uses
  # (`inputs.manylinux-image`), not on the bare runner: the runner's glibc is
  # newer than what the manylinux tag promises, and building there instead
  # would silently bake incompatible symbol versions into a "manylinux" wheel.
  # macOS and Windows have no such container -- cibuildwheel builds directly
  # on the host there too -- so those legs build directly on the runner to
  # match: macOS for the runner's own architecture at
  # `inputs.macos-deployment-target`, Windows with LLVM's clang++ against the
  # MSVC runtime (fastfields-lib's make/common.mk documents both).
  #
  # STATUS: only the `cpu` backend is wired (mirrors release.yaml's current
  # scope). Extending to a CUDA backend needs an nvcc-capable runner/image and
  # `make USE_CUDA=1`, plus uploading libfastfields-cuda alongside the two
  # libs below -- not done here since no CUDA wheel is attempted yet.
  build-native:
    if: ${{ inputs.compiled }}
    name: build native (${{ inputs.backend }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos-deployment-target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          # No submodules: fastfields-dlpack#34 made _fastfields_lib a SHA in
          # `fastfields-lib.sha` that setup.py clones at build time.
          fetch-depth: 0            # versioningit needs the tag
      # The C++ tree is fetched by setup.py at wheel-build time, but this job
      # builds it *before* any setup.py runs -- so it fetches the same pinned
      # SHA itself, the same init/fetch/checkout way setup.py does (a commit
      # id cannot be cloned with --branch). The tree lands in
      # `_fastfields_lib/`, where setup.py would put it and where the
      # build-compiled job's setup.py will find (and reuse) the headers.
      - name: Fetch the pinned fastfields-lib tree
        run: |
          set -euo pipefail
          if [ -d _fastfields_lib/include ]; then
            echo "_fastfields_lib already present"; exit 0
          fi
          sha=$(grep -v '^[[:space:]]*#' fastfields-lib.sha | tr -d '[:space:]')
          echo "pinned fastfields-lib: $sha"
          git init -q _fastfields_lib
          git -C _fastfields_lib remote add origin https://github.com/fastfields/fastfields-lib.git
          git -C _fastfields_lib fetch -q --depth 1 origin "$sha"
          git -C _fastfields_lib checkout -q --detach FETCH_HEAD
      - name: Build libfastfields + libfastfields-cpu (manylinux container)
        if: runner.os == 'Linux'
        # `:latest` rather than pinning the exact tag cibuildwheel resolves
        # internally for CIBW_MANYLINUX_X86_64_IMAGE: what has to match is the
        # glibc ABI, which the manylinux_2_28 *policy* fixes regardless of
        # image tag/patch level -- that's the whole point of the manylinux
        # images -- so this doesn't need to track cibuildwheel's pin exactly.
        #
        # No `-j`: fastfields-lib's top-level Makefile links libfastfields.so
        # without depending on the libcpu sub-make finishing first (its `lib`
        # target lists `libcpu` before `$(BUILDDIR)/libfastfields.$(SOSUF)`,
        # but the latter's own prerequisites don't include the former, so make
        # -j is free to interleave them), so under parallel make the link
        # races ahead and fails to find -lfastfields-cpu -- confirmed by
        # hitting this exact race in a real run of this job. setup.py's
        # from-source path has always invoked plain `make` (no `-j`), which is
        # why the existing build never trips it; matching that here keeps this
        # job as reliable as the build it's replacing. `-j` would be a
        # legitimate follow-up (it needs a fix in fastfields-lib's Makefile
        # first), not something this PR should paper over.
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/project -w /project \
            "quay.io/pypa/${{ inputs.manylinux-image }}_x86_64:latest" \
            bash -c '
              set -euo pipefail
              (yum install -y clang gcc-c++ ||
               (apt-get update && apt-get install -y clang g++))
              git config --global --add safe.directory "*"
              make -C _fastfields_lib CXX=clang++
            '
      # Choco's native GNU make, not MSYS's: its $(abspath) yields the
      # drive-letter paths clang++ and the .d dependency files use. LLVM's
      # clang++ is preinstalled on the Windows images; it targets
      # x86_64-pc-windows-msvc, the runtime CPython is built against.
      - name: Ensure GNU make (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v make >/dev/null 2>&1 || choco install make -y --no-progress
          make --version | head -1
          clang++ --version
      # ARCHFLAGS is what fastfields-lib's Makefile reads on macOS (it is also
      # the variable cibuildwheel exports): the runner's own arch, explicitly,
      # so the libraries' architecture is a stated fact and not a compiler
      # default -- checked right after with lipo.
      - name: Build libfastfields + libfastfields-cpu (host toolchain)
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            export ARCHFLAGS="-arch $(uname -m)"
            echo "ARCHFLAGS=$ARCHFLAGS MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          fi
          make -C _fastfields_lib CXX=clang++
      - name: Check the native libraries' architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          want=$(uname -m)
          for lib in _fastfields_lib/build/libfastfields.dylib \
                     _fastfields_lib/build/lib/libfastfields-cpu.dylib; do
            got=$(lipo -archs "$lib")
            echo "$lib: $got (minos $(otool -l "$lib" | awk '/minos/{print $2; exit}'))"
            if [ "$got" != "$want" ]; then
              echo "::error::$lib is built for '$got', not the runner's '$want'"
              exit 1
            fi
          done
      # Flat, and on Windows including the import libraries (`*.lib`) the
      # extension links against -- a PE/COFF linker cannot link a .dll.
      - name: Stage the built libs flat for upload
        run: |
          set -euo pipefail
          mkdir -p native-lib
          cp _fastfields_lib/build/libfastfields.* native-lib/
          cp _fastfields_lib/build/lib/libfastfields-cpu.* native-lib/
          ls -l native-lib
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.backend }}-${{ matrix.os }}
          path: native-lib/*
          if-no-files-found: error

  # --------------------------------------------------------------- compiled
  # cibuildwheel drives setup.py, which links the nanobind extension against
  # the native libs `build-native` already built (via FASTFIELDS_PREBUILT_LIB
  # -- setup.py copies them in and skips its own `make` step) and ships them
  # inside the wheel.
  #
  # One job per (OS, backend), and that is the whole matrix: the extension is
  # built in nanobind's split mode against Python's limited API, so a single
  # `cp310-abi3` wheel is installable on every CPython >= 3.10 and there is
  # nothing to repeat per interpreter. This used to be one job per (OS,
  # python-selector) -- four Linux jobs producing four nearly identical
  # wheels. The shape now matches `build-native`'s, which never had a Python
  # axis because the native library has no Python ABI at all.
  build-compiled:
    if: ${{ inputs.compiled }}
    name: build (${{ inputs.backend }}, ${{ matrix.os }})
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Read by cibuildwheel itself (it sets the wheel's platform tag from
      # it) and inherited by the extension's compile; must equal the value
      # build-native used, which is the same input.
      MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos-deployment-target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          # No submodules: fastfields-dlpack#34 made _fastfields_lib a SHA in
          # `fastfields-lib.sha` that setup.py clones at build time.
          fetch-depth: 0            # versioningit needs the tag
      # The runner's own architecture is the only one built on macOS: see
      # the `runners` input. Spelled out so cibuildwheel cannot pick another.
      - name: Target architecture (macOS)
        if: runner.os == 'macOS'
        run: echo "CIBW_ARCHS_MACOS=$(uname -m)" >> "$GITHUB_ENV"
      # Downloaded to a fixed path under the checkout root so it lands inside
      # cibuildwheel's /project mount; FASTFIELDS_PREBUILT_LIB below points
      # setup.py at it. build-native staged the two libs flat (no
      # build/ or build/lib/ nesting), matching what setup.py expects there.
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ inputs.backend }}-${{ matrix.os }}
          path: prebuilt-native-lib
      - uses: pypa/cibuildwheel@v2.21
        env:
          # One interpreter, and the wheel it emits is not that interpreter's:
          # setup.py sets bdist_wheel's py_limited_api, so the output is
          # `<tag>-abi3-<plat>`. Selecting more than one CPython here would
          # just rebuild the same abi3 wheel and overwrite it.
          CIBW_BUILD: ${{ inputs.cibw-build-python }}-*
          CIBW_SKIP: "*-musllinux_* *_i686 *-win32"
          # x64 only: fastfields-lib has not been built for Windows on ARM.
          CIBW_ARCHS_WINDOWS: AMD64
          # AlmaLinux 8 rather than cibuildwheel's default CentOS 7 image: its
          # system libstdc++ headers are GCC 8, which clang picks up without
          # any --gcc-toolchain steering. (CentOS 7's are GCC 4.8, whose
          # libstdc++ is patchy for C++11.) glibc 2.28+ is a fine floor for a
          # project that has never shipped a wheel.
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ inputs.manylinux-image }}
          # FF_WHEEL_VARIANT is read by fastfields-dlpack's custom versioningit
          # hook, which stamps the backend into the PEP 440 local version
          # identifier at build time (0.0.0.dev1+cpu). Doing it in versioningit
          # rather than by repacking the finished wheel means the version is
          # correct in METADATA, in RECORD and in the generated _version.py
          # from the outset, so nothing can drift out of sync.
          #
          CIBW_ENVIRONMENT: "CXX=clang++ FF_WHEEL_VARIANT=${{ inputs.backend }}"
          # FASTFIELDS_PREBUILT_LIB points setup.py at the native libs
          # `build-native` already built (download-artifact path above,
          # relative to the checkout root), so it copies them in and skips its
          # own `make` invocation entirely. Platform-specific because the path
          # cibuildwheel sees it at differs: /project is where the Linux
          # (manylinux container) build mounts the checkout. macOS and Windows
          # build directly on the runner, so they pass the path RELATIVE to
          # the project root, which setup.py resolves against its own
          # directory -- no host path (and no Windows backslashes) to quote.
          CIBW_ENVIRONMENT_LINUX: >-
            CXX=clang++ FF_WHEEL_VARIANT=${{ inputs.backend }}
            FASTFIELDS_PREBUILT_LIB=/project/prebuilt-native-lib
          CIBW_ENVIRONMENT_MACOS: >-
            CXX=clang++ FF_WHEEL_VARIANT=${{ inputs.backend }}
            FASTFIELDS_PREBUILT_LIB=prebuilt-native-lib
          CIBW_ENVIRONMENT_WINDOWS: >-
            CXX=clang++ FF_WHEEL_VARIANT=${{ inputs.backend }}
            FASTFIELDS_PREBUILT_LIB=prebuilt-native-lib
          # `clang` for the C++ build -- and `gcc-c++` alongside it, which is
          # NOT redundant: clang is only the compiler driver, it uses the
          # system GCC's libstdc++ headers. Without gcc-c++ the manylinux image
          # has no C++ standard library headers at all and the build dies on
          # `fatal error: 'stdexcept' file not found` at the very first
          # translation unit. (The Makefiles are clang-only -- they hard-code
          # -ferror-limit / -ftemplate-backtrace-limit -- so building with g++
          # instead is not an option here.)
          #
          # `git config --global safe.directory` so versioningit can run
          # `git describe` against the bind-mounted, differently-owned /project
          # tree inside the container -- without it git refuses ("dubious
          # ownership") and the version degrades to "0+unknown".
          CIBW_BEFORE_ALL_LINUX: >-
            (yum install -y clang gcc-c++ ||
             (apt-get update && apt-get install -y clang g++)) &&
            git config --global --add safe.directory '*'
          # Vendor third-party deps and apply the manylinux tag, but leave our
          # own libfastfields* alone: the package already carries an
          # $ORIGIN/lib rpath and ships them itself.
          #
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair
            --exclude libfastfields.so
            --exclude libfastfields-cpu.so
            --exclude libfastfields-cuda.so
            -w {dest_dir} {wheel}
          # macOS: delocate, as cibuildwheel would run it by default, stated
          # here because `--require-archs` is the half that matters -- it
          # fails the repair if any binary in the wheel (the extension AND the
          # two shipped dylibs) lacks the wheel's architecture, which is the
          # mislabelled-wheel guard. Unlike auditwheel it needs no excludes:
          # delocate only copies in libraries from OUTSIDE the wheel, and
          # libfastfields{,-cpu}.dylib are already inside it, reached through
          # the extension's @loader_path/lib rpath and their own @rpath
          # install names (fastfields-lib's make/common.mk). It also rejects a
          # dylib whose minimum macOS is newer than the platform tag.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs}
            -w {dest_dir} -v {wheel}
          # Windows: no repair, which is also cibuildwheel's default.
          # delvewheel would vendor (and name-mangle) libfastfields*.dll,
          # which the wheel already ships under fastfields/dlpack/lib/ and
          # fastfields/dlpack/__init__.py puts on the DLL search path with
          # os.add_dll_directory; and it would want a top-level __init__.py
          # that `fastfields`, a PEP 420 namespace, must never have. What the
          # wheel then relies on from the system is the MSVC C++ runtime
          # (msvcp140.dll), as most C++ extension wheels do.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
      - uses: actions/upload-artifact@v4
        with:
          # One job per (backend, os) again, so (backend, os) is once more a
          # unique artifact name. While the Python axis existed this also
          # carried the matrix.python value; upload-artifact rejects a
          # collision, so a stale suffix would be an error rather than a
          # silent overwrite.
          name: dist-${{ inputs.backend }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # -------------------------------------------------------------- publish
  publish:
    name: publish to the release
    needs: [build-native, build-pure, build-compiled]
    # Exactly one of {build-pure, build-compiled} runs (build-native only
    # alongside build-compiled); `needs` on a skipped job resolves to
    # 'skipped', so gate on "nothing actually failed" rather than success().
    # Never on a dry run (`publish: false`).
    if: ${{ inputs.publish && always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `pattern: dist-*` matters here: without it this would also sweep up
      # the `native-*` artifact (the raw .so files from build-native), which
      # would then get uploaded onto the release below by `gh release upload
      # dist/*` alongside the actual wheels/sdist.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Guard rail. The built version must equal the release tag *exactly*,
      # including the local label -- not merely start with it. Two distinct
      # failure modes are silent without this:
      #
      #   * a shallow checkout or unreachable tag degrades versioningit to
      #     "0+unknown", which still produces a perfectly valid-looking wheel;
      #   * a build that is tagged but not clean yields e.g.
      #     "0.0.0.dev1+cpu.4.gdeadbee". generate.py buckets on the *whole*
      #     local segment (`backend = local or "cpu"`), so that wheel would be
      #     filed under a phantom "cpu.4.gdeadbee" backend and never appear in
      #     cpu/ -- an index that looks fine and resolves to nothing.
      #
      # Comparing the full version catches both.
      - name: Assert the built version matches the release tag
        env:
          TAG: ${{ inputs.tag }}
          COMPILED: ${{ inputs.compiled }}
          BACKEND: ${{ inputs.backend }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no wheels were produced"; exit 1
          fi
          expected="${TAG#v}"
          if [ "$COMPILED" = "true" ]; then
            expected="${expected}+${BACKEND}"
          fi
          rc=0
          for w in "${wheels[@]}"; do
            # PEP 427 escapes '-' inside the version, so field 2 is the version.
            ver="$(basename "$w" | cut -d- -f2)"
            if [ "$ver" != "$expected" ]; then
              echo "::error::$(basename "$w"): version '$ver' != expected" \
                   "'$expected'. '0+unknown' means the checkout was shallow or" \
                   "the tag unreachable; a trailing '.N.g<sha>' means the tree" \
                   "was not clean at the tag, and the wheel index would file it" \
                   "under a phantom backend."
              rc=1
            fi
          done
          [ $rc -eq 0 ] && echo "all wheels report version $expected"
          exit $rc

      # generate.py reads a sibling <wheel>.sha256 release asset to emit the
      # PEP 503 '#sha256=' fragment (the Releases API exposes no per-asset
      # digest). Without these the index still works but warns and links
      # unpinned artifacts.
      - name: Generate sha256 sidecars
        run: |
          set -euo pipefail
          cd dist
          for f in *.whl *.tar.gz; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          ls -l

      - name: Upload artifacts onto the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        # --clobber makes a retry (workflow_dispatch) idempotent.
        run: gh release upload "$TAG" dist/* --clobber

      # Push-trigger the index rebuild from here, rather than having the index
      # poll for new assets.
      - name: Ping the wheel index to rebuild
        if: ${{ inputs.dispatch-index }}
        env:
          GH_TOKEN: ${{ secrets.WHL_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WHL_DISPATCH_TOKEN is not set, so fastfields/whl" \
                 "cannot be triggered from here (the default GITHUB_TOKEN is" \
                 "scoped to this repo). Run the 'Build and deploy wheel index'" \
                 "workflow in fastfields/whl by hand to pick these wheels up."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fastfields/whl/dispatches \
            -d '{"event_type":"wheels-updated"}'
          echo "dispatched wheels-updated to fastfields/whl"
