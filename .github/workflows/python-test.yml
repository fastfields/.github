name: Test

# Reusable test workflow shared by the fastfields Python packages. Since
# fastfields#3 merged the four wrapper distributions into `fastfields`, the
# callers are `fastfields` (which ships fastfields.{helpers,numpy,cupy,torch,
# auto}) and `fastfields-dlpack`. Call it from a repo with:
#
#   jobs:
#     pytest:
#       uses: fastfields/.github/.github/workflows/python-test.yml@main
#       secrets: inherit
#
# `secrets: inherit` lets the checkout pick up CI_SUBMODULE_TOKEN where a repo
# defines it (fastfields-dlpack needs it for its C++ submodule chain); repos
# without that secret fall back to the default token, which is fine for a
# pure-Python checkout.
#
# The fastfields-dlpack install step is skipped automatically for
# fastfields-dlpack itself, which *is* the dlpack package -- the guard keys off
# the calling repo's name, so no per-repo input is needed.
#
# A repo that does not depend on fastfields-dlpack at all passes
# `needs-dlpack: false`, which skips both that install *and* the C++ toolchain
# steps that exist only to serve it -- see the input's description below.

on:
  workflow_call:
    inputs:
      os:
        description: "JSON array of runner OSes for the matrix"
        type: string
        default: '["ubuntu-latest", "macos-latest"]'
      python-versions:
        description: "JSON array of Python versions for the matrix"
        type: string
        default: '["3.9", "3.11", "3.12"]'
      needs-dlpack:
        description: >-
          Whether this package needs fastfields-dlpack installed to run its
          tests. Defaults to true, which is right for `fastfields` (whose
          numpy / torch / cupy / auto namespaces all call the compiled
          bindings) and for fastfields-dlpack itself, whose own
          `pip install ".[test]"` builds the extension. Set it to false for a
          package with no dlpack dependency, to skip both the install below
          and the clang toolchain steps that exist solely to serve it --
          otherwise such a repo would build the entire C++ chain (recursive
          submodule checkout + clang compile) on every runner in the matrix
          for nothing. This was fastfields-helpers' case before it was merged
          into `fastfields`; no current caller passes false, and the input is
          kept because the cost of getting it wrong is an hour of CI per push.
        type: boolean
        default: true

permissions:
  contents: read

# Cancel superseded runs on the same ref. The group is keyed on the *calling*
# repo (github.repository resolves to the caller) so runs in different repos
# never cancel each other -- only a newer push to the same PR/branch does.
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}
    # The C++ build that fastfields-dlpack needs is driven by clang++ on every
    # OS; the per-OS steps below make sure a clang++ is on PATH.
    env:
      CXX: clang++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULE_TOKEN }}
          # versioningit derives the version from `git describe`, which needs
          # the tags -- a shallow (depth 1) checkout hides them and the version
          # silently falls back to "0+unknown".
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache the pip download/wheel dir, keyed on the resolved deps in
          # pyproject.toml, so repeat installs of numpy/torch/... are fast.
          cache: "pip"
          cache-dependency-path: pyproject.toml
      # The three toolchain steps below exist only so the fastfields-dlpack
      # C++ build has a clang++ -- either the cross-repo source install further
      # down, or (for fastfields-dlpack itself) its own `pip install ".[test]"`.
      # A `needs-dlpack: false` caller compiles nothing, so they are skipped.
      - name: Install build toolchain (Linux)
        if: ${{ inputs.needs-dlpack && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install build toolchain (macOS)
        if: ${{ inputs.needs-dlpack && runner.os == 'macOS' }}
        # clang++ ships with the Xcode Command Line Tools, already present on
        # the macOS runners, so there is nothing to install here.
        run: clang++ --version
      - name: Install build toolchain (Windows)
        if: ${{ inputs.needs-dlpack && runner.os == 'Windows' }}
        # NOTE: the C++ Makefiles (cpu-lib/lib/bind-py/fastfields-dlpack) were
        # made Windows-portable -- clang-style flags with no -fPIC/-soname
        # issues, and the recipes run under git bash. This should work, but
        # there's no live/verified green Windows CI run yet, so it may still
        # need iteration on a first real run. Kept visible (not hidden) so
        # this stays tracked either way.
        run: choco install -y llvm make
      # Dogfood our own wheel index (fastfields#6). Installing from the index
      # is the path we tell users to use, so CI should be the first thing to
      # notice when it breaks -- and it is the only coverage the index will
      # ever get, since nothing else in the org installs from it.
      #
      # The `git+` source build is kept as a FALLBACK, not as the primary
      # path, because no release has been published yet: the index is live and
      # correct but empty, so the first attempt genuinely resolves to nothing
      # today and a hard failure would turn every wrapper repo red for a
      # reason that is not their bug. The `::warning::` is deliberate and
      # should be checked, not ignored -- once `0.0.dev0` is published it must
      # stop appearing, and at that point the fallback can be deleted outright
      # (whl#1 tracks cutting that first release).
      #
      # `--extra-index-url`, not `--index-url`: the index serves only the
      # fastfields projects, so fastfields-dlpack's own dependency
      # (`packaging`) still has to come from PyPI. The `cpu/` lane is the only
      # published one; CUDA lanes are deferred until a cu* wheel builds, and
      # a CI runner has no GPU to use one on in any case.
      #
      # pip *does* run `git submodule update --init --recursive` for a git+
      # install, so the fallback works as long as the pinned submodule chain
      # on fastfields-dlpack@main is healthy -- which is exactly the fragility
      # installing from the index removes.
      #
      # For fastfields-dlpack itself this step is skipped (it IS dlpack); the
      # guard uses `github.repository`, which in a reusable workflow resolves
      # to the *calling* repo. `needs-dlpack: false` skips it everywhere.
      - name: Install fastfields-dlpack from the wheel index
        if: ${{ inputs.needs-dlpack && github.repository != 'fastfields/fastfields-dlpack' }}
        run: |
          if pip install fastfields-dlpack \
              --extra-index-url https://fastfields.github.io/whl/cpu/; then
            echo "installed fastfields-dlpack from the wheel index"
            exit 0
          fi
          echo "::warning::fastfields-dlpack could not be installed from" \
               "https://fastfields.github.io/whl/cpu/ -- falling back to a" \
               "git+ source build. Expected until the first release is" \
               "published (whl#1); investigate the index if a release exists."
          pip install "fastfields-dlpack @ git+https://github.com/fastfields/fastfields-dlpack@main"
      - name: Install package + test deps
        run: pip install ".[test]"
      - name: Run pytest
        run: cd /tmp && python -m pytest ${{ github.workspace }}/tests -q
